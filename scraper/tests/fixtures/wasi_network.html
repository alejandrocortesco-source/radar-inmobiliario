<!doctype html><html lang="es"><head><meta charset="utf-8"></head><body>
<h1>Inmuebles en red</h1><div class="box advanced-search"><div id="controls"></div>
<input id="property_id"><input id="title"><button id="advanced_search">Buscar</button></div>
<select name="properties_table_length"><option value="1">1</option><option value="2">2</option></select><div id="title_filter"></div><div id="properties_table_processing" hidden>Procesando</div>
<table id="properties_table"><tbody></tbody></table>
<div id="properties_table_info"></div><div id="properties_table_paginate"><span class="current">1</span></div><a id="properties_table_next">Siguiente</a>
<div id="modal_create_demand" class="modal" style="display:none"><select id="bathrooms"><option value="777">No es el filtro de búsqueda</option></select></div><div class="modal" id="detail" style="display:none"></div>
<div class="modal" id="modal_company_details_network" style="display:none"></div>
<script>
const options = __OPTIONS__, records = __RECORDS__, repeat = __REPEAT__;
let number=1,pageSize=1;
const geo=['id_pais','id_dpto','id_ciudad','id_localidad','id_zona'];
const selects=geo.concat(['property_type_id','business_type_id','garage','beedroms','bathrooms','typeAccount']);
function optionsFor(c){return options[c+':'+(geo.includes(c)?geo.slice(0,geo.indexOf(c)).map(p=>document.getElementById(p)?.value||'').join('/'):'')]||[]}
selects.forEach(c=>{const s=document.createElement('select');s.id=c;document.getElementById('controls').append(s);s.innerHTML='<option value="">Todos</option>'+optionsFor(c).map(o=>`<option value="${o.value}">${o.label}</option>`).join('');if(c==='id_pais')s.value='1';if(c==='id_dpto')s.value='15';if(c==='id_ciudad')s.value='794';if(c==='id_localidad')s.value='1';s.addEventListener('change',()=>setTimeout(()=>{const idx=geo.indexOf(c);if(idx<0)return;geo.slice(idx+1).forEach(ch=>{const t=document.getElementById(ch);t.innerHTML='<option value="">Todos</option>'+optionsFor(ch).map(o=>`<option value="${o.value}">${o.label}</option>`).join('')})},5))});
['building_date','area_from','area_to','price_from','price_to'].forEach(c=>{const e=document.createElement('input');e.id=c;document.getElementById('controls').append(e)});
function draw(){const slice=records.slice((number-1)*pageSize,number*pageSize);document.querySelector('#properties_table tbody').innerHTML=slice.map(r=>`<tr id="${r.id}"><td></td><td><a onclick="show_property_details('${r.id}')"><img src="https://image.wasi.co/synthetic-blocked-photo"></a></td><td>Código Wasi: ${r.id}<a onclick="openModalDetailsPropertyNetwork('company','${r.id}')">Empresa sintética</a></td><td><a onclick="show_property_details('${r.id}')"><strong>Casa sintética ${r.id}</strong></a><br>Vender - Casa<br>Colombia/Cundinamarca/Bogotá D.C.<br>$${r.price}</td><td></td><td style="display:none"><a href="https://example.invalid/casa/${r.id}">Original</a></td></tr>`).join('');document.getElementById('properties_table_info').textContent=`${records.length?(number-1)*pageSize+1:0} a ${Math.min(number*pageSize,records.length)} de ${records.length} inmuebles`;document.querySelector('.current').textContent=number;document.getElementById('properties_table_next').className=number*pageSize>=records.length?'disabled':'';document.getElementById('title_filter').textContent='Búsqueda activa: '+document.getElementById('title').value+' '+geo.map(c=>document.getElementById(c).selectedOptions[0]?.textContent).join(' ')}
document.querySelector('[name=properties_table_length]').onchange=e=>{pageSize=Number(e.target.value);number=1;setTimeout(draw,5)};
document.getElementById('advanced_search').onclick=()=>{number=1;setTimeout(draw,5)};
document.getElementById('properties_table_next').onclick=()=>{if(!repeat)number++;setTimeout(draw,5)};
function photoUrl(n){return 'https://image.wasi.co/'+btoa(JSON.stringify({bucket:'synthetic',key:'photo-'+n+'.jpg',edits:{resize:{width:555}}}))}
function gallery(){return `<div class="fotorama"><div class="fotorama__stage"><div class="fotorama__stage__frame fotorama__active"><img src="${photoUrl(1)}"></div></div><div class="fotorama__nav"><div class="fotorama__nav__frame fotorama__active"><img src="${photoUrl(1)}">1</div><div class="fotorama__nav__frame"><img src="${photoUrl(2)}">2</div><div class="fotorama__nav__frame"><img src="${photoUrl(3)}">3</div></div><button class="fotorama__arr--next" onclick="nextPhoto(this)">Siguiente imagen</button></div>`}
function nextPhoto(button){const g=button.closest('.fotorama'),frames=[...g.querySelectorAll('.fotorama__nav__frame')],index=frames.findIndex(e=>e.classList.contains('fotorama__active'))+1;frames.forEach((e,i)=>e.classList.toggle('fotorama__active',i===index));setTimeout(()=>g.querySelector('.fotorama__stage img').src=photoUrl(index+1),80)}
function render_property_details(id){let r=records.find(r=>r.id===id);const m=document.getElementById('detail');m.innerHTML=`<div class="top_close"><a onclick="document.getElementById('detail').style.display='none'">Cerrar</a></div><div class="property-details-panels"><div class="z-content"><h1>Casa sintética ${id}</h1>${gallery()}<ul>${Object.entries({'Código':id,'Tipo de inmueble':'Casa','Tipo de negocio':'Vender','Ubicación':'Bogotá D.C., Cundinamarca, Colombia','Localidad':'Usaquén','Zona / barrio':'Cedritos','Área Construida':'80 M2','Alcobas':'3','Baños':'2','Garaje':'0'}).map(([k,v])=>`<li><strong>${k}:</strong> ${v}</li>`).join('')}</ul><p class="precio"><strong>Venta</strong>:<span>$${r.price}</span></p><div class="fotDetails"><div class="tab-content"><div class="tab-pane"><div class="tabSubCont"><ul><li>Balcón</li></ul></div></div><div class="tab-pane"><div>Descripción de prueba sintética.</div></div></div></div></div></div>`;m.style.display='block'}
async function show_property_details(id){const old=document.querySelector('#detail li');if(old)old.textContent='Código: '+id;await (await fetch('/usuario/inmuebles/'+id)).text();render_property_details(id);const g=document.querySelector('#detail .fotorama'),nav=g.querySelector('.fotorama__nav'),next=g.querySelector('.fotorama__arr--next');nav.remove();next.remove();setTimeout(()=>g.append(nav,next),80)}
function renderCompany(company,id){const m=document.getElementById('modal_company_details_network');m.innerHTML=`<button class="close" onclick="document.getElementById('modal_company_details_network').style.display='none'">Cerrar</button><div class="modalRedContact"><h1>Empresa sintética</h1><h2>Contacto<span>(Agente encargado)</span></h2><div class="groupInfo"><div class="lab"><span class="lab-tt">Teléfono móvil:</span><div class="text">+57300123${id.padStart(4,'0')}</div></div></div></div>`;m.style.display='block'}
async function openModalDetailsPropertyNetwork(company,id){await (await fetch('/usuario/ajax-inmuebles/get-company')).text();renderCompany(company,id)}
draw();
</script></body></html>
