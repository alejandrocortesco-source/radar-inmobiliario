{% if categorias %}
{% include '_gestion_busquedas.html' %}
<p class="category-heading" id="categorias-titulo">Categorías de actualización</p>
<nav class="quick-filters" aria-labelledby="categorias-titulo">
{% for categoria in categorias %}
  <a href="{{categoria.url}}" data-category="{{categoria.clave}}" {% if filtros.categoria.value == categoria.clave %}aria-current="true"{% endif %}>{{categoria.nombre}} <span>{{categoria.cantidad}}</span></a>
{% endfor %}
</nav>
{% endif %}
