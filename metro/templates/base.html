<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Metro · Explorador local</title><style>
:root{font-family:Segoe UI,system-ui,sans-serif;color:#173036;background:#f3f6f5}*{box-sizing:border-box}body{margin:0}header{background:#123e3b;color:white;padding:22px 5%;display:flex;justify-content:space-between}header a{color:inherit;text-decoration:none}header small{color:#b2d2c7}main{max-width:1250px;margin:36px auto;padding:0 24px}h1{font-size:30px;letter-spacing:-.8px;margin:0 0 12px}h2{font-size:21px}p{line-height:1.6}a{color:#10685c}button,.button{background:#176c5c;color:white;border:0;border-radius:8px;padding:11px 16px;text-decoration:none;display:inline-block;font:inherit;cursor:pointer}.panel{background:white;border:1px solid #dce5df;border-radius:12px;padding:24px;margin:20px 0}.muted{color:#647976;font-size:14px}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:24px 0}.stat{padding:18px;background:white;border:1px solid #dce5df;border-radius:10px}.stat strong{display:block;font-size:27px;margin-top:8px}.filters{display:flex;gap:10px;flex-wrap:wrap}select,input{border:1px solid #cad8d1;border-radius:7px;padding:10px;font:inherit;max-width:100%}input{flex:1;min-width:150px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:14px}td,th{padding:15px 10px;text-align:left;border-bottom:1px solid #e5ebe8}th{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:#697d77}td:first-child{max-width:390px}td small{display:block;color:#647976;margin-top:6px}.badge{border-radius:20px;padding:5px 10px;background:#eaf0ed;display:inline-block;font-size:12px}.success{background:#ddf4e6;color:#20623b}.partial,.incomplete{background:#fff0ce;color:#795500}.failed,.blocked{background:#ffe1dc;color:#8b3225}.description{white-space:pre-wrap}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.datum{padding:12px;background:#f5f8f6;border-radius:7px;overflow-wrap:anywhere}.datum label{display:block;color:#677d74;font-size:12px;margin-bottom:6px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f3
